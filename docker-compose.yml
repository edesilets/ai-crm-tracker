services:
  # Customers, contact info and quotes. http://localhost:8001/docs
  crm:
    build: ./services/crm
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Vehicles, trips to job sites, GPS positions. http://localhost:8002/docs
  tracking:
    build: ./services/tracking
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tracking
      REDIS_URL: redis://redis:6379/0
      CRM_URL: http://crm:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      crm:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the crm and tracking databases on first start.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Uses TCP so it only passes once the init scripts have finished
      # and the tracking database exists.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U $$POSTGRES_USER -d tracking -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Uncomment to reach Postgres from your host machine:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Uncomment to reach Redis from your host machine:
    # ports:
    #   - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  pgadmindata:
